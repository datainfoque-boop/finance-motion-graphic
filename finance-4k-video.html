<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Finance Motion Graphic 4K - Pure HTML</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #0ea5e9;
            font-size: 18px;
        }

        .loading.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">Rendering 4K Motion Graphic...</div>
    <canvas id="canvas"></canvas>

    <script>
        // ============================================
        // PURE HTML CANVAS 4K MOTION GRAPHIC ENGINE
        // Tanpa library apapun, pure JavaScript + Canvas API
        // ============================================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
        const loading = document.getElementById('loading');

        // Set 4K resolution
        const WIDTH = 3840;  // 4K UHD width
        const HEIGHT = 2160; // 4K UHD height
        
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        // Animation settings
        const DURATION = 12000; // 12 seconds in milliseconds
        const FPS = 60;
        const FRAME_TIME = 1000 / FPS;

        let frameCount = 0;
        let animationTime = 0;
        let isRunning = true;

        // Color palette - Premium
        const colors = {
            bg1: '#0f172a',
            bg2: '#1e293b',
            accent1: '#0ea5e9',
            accent2: '#06b6d4',
            accent3: '#10b981',
            accent4: '#f59e0b',
            accent5: '#ec4899',
            text: '#f1f5f9',
            textSub: '#94a3b8',
            dark: '#0f172a',
            light: '#e2e8f0',
        };

        // Utility: Draw rounded rectangle
        function drawRoundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // Easing functions
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function easeOutElastic(t) {
            const c5 = (2 * Math.PI) / 4.5;
            return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c5) + 1;
        }

        function easeInOutQuad(t) {
            return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        }

        // Draw animated background with grid
        function drawBackground() {
            const bgGrad = ctx.createLinearGradient(0, 0, WIDTH, HEIGHT);
            bgGrad.addColorStop(0, colors.bg1);
            bgGrad.addColorStop(0.5, colors.bg2);
            bgGrad.addColorStop(1, colors.bg1);
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Animated grid pattern
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.03)';
            ctx.lineWidth = 2;
            const gridSize = 120;
            const offset = (animationTime * 0.05) % gridSize;

            for (let i = -gridSize; i < WIDTH + gridSize; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(i + offset, 0);
                ctx.lineTo(i + offset, HEIGHT);
                ctx.stroke();
            }

            for (let i = -gridSize; i < HEIGHT + gridSize; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, i + offset);
                ctx.lineTo(WIDTH, i + offset);
                ctx.stroke();
            }

            // Animated gradient overlay
            const overlayGrad = ctx.createRadialGradient(WIDTH / 2, HEIGHT / 2, 0, WIDTH / 2, HEIGHT / 2, WIDTH);
            overlayGrad.addColorStop(0, 'rgba(14, 165, 233, 0.05)');
            overlayGrad.addColorStop(1, 'rgba(14, 165, 233, 0)');
            ctx.fillStyle = overlayGrad;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }

        // Draw animated chart bars
        function drawChart() {
            const chartX = 300;
            const chartY = 600;
            const chartWidth = 600;
            const chartHeight = 500;
            const barCount = 20;
            const barWidth = chartWidth / barCount;

            // Chart container
            ctx.fillStyle = 'rgba(15, 23, 42, 0.5)';
            drawRoundRect(chartX - 80, chartY - 80, chartWidth + 160, chartHeight + 160, 32);
            ctx.fill();

            // Border
            ctx.strokeStyle = 'rgba(14, 165, 233, 0.3)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Draw bars with animation
            for (let i = 0; i < barCount; i++) {
                const barX = chartX + i * barWidth;
                const baseHeight = Math.sin(i * 0.5) * 150 + 200;
                const animProgress = Math.min(1, (animationTime - i * 30) / 400);
                const heightMultiplier = easeInOutCubic(animProgress);
                const barHeight = baseHeight * heightMultiplier;

                // Bar gradient
                const barGrad = ctx.createLinearGradient(barX, chartY - barHeight, barX, chartY);
                barGrad.addColorStop(0, colors.accent1);
                barGrad.addColorStop(1, colors.accent2);
                ctx.fillStyle = barGrad;
                drawRoundRect(barX + 8, chartY - barHeight, barWidth - 16, barHeight, 12);
                ctx.fill();

                // Bar highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                drawRoundRect(barX + 12, chartY - barHeight + 12, (barWidth - 24) * 0.3, barHeight - 24, 8);
                ctx.fill();
            }

            // Baseline
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(chartX - 80, chartY);
            ctx.lineTo(chartX + chartWidth + 80, chartY);
            ctx.stroke();

            // Y-axis labels
            ctx.font = 'bold 32px Arial';
            ctx.fillStyle = colors.textSub;
            ctx.textAlign = 'right';
            for (let i = 0; i <= 4; i++) {
                const value = (i * 25) + 'K';
                const y = chartY - (i * chartHeight / 4);
                ctx.fillText(value, chartX - 120, y + 12);
            }
        }

        // Draw animated line chart
        function drawLineChart() {
            const lineX = 1200;
            const lineY = 300;
            const lineWidth = 960;
            const lineHeight = 600;

            // Background
            ctx.fillStyle = 'rgba(15, 23, 42, 0.5)';
            drawRoundRect(lineX - 80, lineY - 80, lineWidth + 160, lineHeight + 160, 32);
            ctx.fill();

            // Border
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.3)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Grid
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.1)';
            ctx.lineWidth = 2;
            for (let i = 0; i <= 5; i++) {
                const y = lineY + (i * (lineHeight - 40) / 5);
                ctx.beginPath();
                ctx.moveTo(lineX - 40, y);
                ctx.lineTo(lineX + lineWidth + 40, y);
                ctx.stroke();
            }

            // Animated line with wave effect
            const points = 100;
            const animPhase = (animationTime / DURATION) * Math.PI * 6;

            ctx.beginPath();
            for (let i = 0; i < points; i++) {
                const x = lineX + (i / points) * lineWidth;
                const yWave = Math.sin((i / points) * Math.PI * 4 + animPhase) * 100;
                const yTrend = (i / points) * (lineHeight - 200);
                const y = lineY + 100 + yTrend + yWave;

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }

            ctx.strokeStyle = colors.accent3;
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            // Fill area under line
            ctx.lineTo(lineX + lineWidth, lineY + lineHeight);
            ctx.lineTo(lineX, lineY + lineHeight);
            ctx.closePath();
            const lineGrad = ctx.createLinearGradient(0, lineY, 0, lineY + lineHeight);
            lineGrad.addColorStop(0, 'rgba(16, 185, 129, 0.4)');
            lineGrad.addColorStop(1, 'rgba(16, 185, 129, 0)');
            ctx.fillStyle = lineGrad;
            ctx.fill();

            // Glowing dots on line
            for (let i = 0; i < points; i += 12) {
                const x = lineX + (i / points) * lineWidth;
                const yWave = Math.sin((i / points) * Math.PI * 4 + animPhase) * 100;
                const yTrend = (i / points) * (lineHeight - 200);
                const y = lineY + 100 + yTrend + yWave;

                // Outer glow
                ctx.fillStyle = 'rgba(16, 185, 129, 0.2)';
                ctx.beginPath();
                ctx.arc(x, y, 32, 0, Math.PI * 2);
                ctx.fill();

                // Inner dot
                ctx.fillStyle = colors.accent3;
                ctx.beginPath();
                ctx.arc(x, y, 12, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Draw floating coins with 3D effect
        function drawCoins() {
            const coins = [
                { x: 500, y: 280, delay: 0 },
                { x: 1900, y: 300, delay: 400 },
                { x: 900, y: 200, delay: 200 },
                { x: 1600, y: 1200, delay: 600 },
            ];

            coins.forEach(coin => {
                const time = animationTime - coin.delay;
                if (time < 0 || time > 3000) return;

                const progress = time / 3000;
                const scaleProgress = easeOutElastic(Math.min(progress * 1.5, 1));
                const floatY = Math.sin(progress * Math.PI * 3) * 40;
                const rotZ = progress * Math.PI * 8;

                ctx.save();
                ctx.translate(coin.x, coin.y + floatY);
                ctx.scale(scaleProgress, scaleProgress);
                ctx.rotate(rotZ);

                // Coin body
                const coinGrad = ctx.createLinearGradient(-60, -60, 60, 60);
                coinGrad.addColorStop(0, '#fbbf24');
                coinGrad.addColorStop(0.5, '#f59e0b');
                coinGrad.addColorStop(1, '#d97706');
                ctx.fillStyle = coinGrad;
                ctx.beginPath();
                ctx.arc(0, 0, 60, 0, Math.PI * 2);
                ctx.fill();

                // Coin 3D border
                ctx.strokeStyle = '#b45309';
                ctx.lineWidth = 8;
                ctx.stroke();

                // Shine effect
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(-20, -20, 24, 0, Math.PI * 2);
                ctx.fill();

                // Dollar sign
                ctx.font = 'bold 64px Arial';
                ctx.fillStyle = '#78350f';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', 0, 0);

                ctx.restore();
            });
        }

        // Draw KPI cards with stagger animation
        function drawKPICards() {
            const cards = [
                { x: 200, y: 140, label: 'Total Assets', value: '$2.48M', icon: '💰', delay: 0, color: colors.accent1 },
                { x: 800, y: 140, label: 'Growth Rate', value: '+24.8%', icon: '📈', delay: 300, color: colors.accent2 },
                { x: 1400, y: 140, label: 'ROI', value: '18.5%', icon: '🎯', delay: 600, color: colors.accent3 },
                { x: 2000, y: 140, label: 'Portfolio Status', value: 'Active', icon: '✓', delay: 900, color: colors.accent4 },
            ];

            cards.forEach(card => {
                const time = animationTime - card.delay;
                const progress = Math.min(Math.max(time / 600, 0), 1);
                const slideY = (1 - easeInOutQuad(progress)) * 60;
                const opacity = progress;

                ctx.save();
                ctx.globalAlpha = opacity;
                ctx.translate(card.x, card.y + slideY);

                // Card background
                ctx.fillStyle = 'rgba(30, 41, 59, 0.7)';
                drawRoundRect(-90, -50, 180, 100, 16);
                ctx.fill();

                // Accent border
                ctx.strokeStyle = card.color;
                ctx.lineWidth = 3;
                ctx.stroke();

                // Top accent line
                ctx.fillStyle = card.color;
                ctx.fillRect(-90, -50, 180, 4);

                // Icon
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(card.icon, -50, 0);

                // Label
                ctx.font = 'bold 24px Arial';
                ctx.fillStyle = colors.textSub;
                ctx.textAlign = 'left';
                ctx.fillText(card.label, -30, -18);

                // Value
                ctx.font = 'bold 32px Arial';
                ctx.fillStyle = colors.text;
                ctx.fillText(card.value, -30, 20);

                ctx.restore();
            });
        }

        // Draw percentage counter animation
        function drawPercentageCounter() {
            const progress = easeInOutCubic(Math.min(animationTime / 4000, 1));
            const percentage = Math.floor(progress * 100);

            ctx.save();
            ctx.translate(WIDTH - 400, HEIGHT - 300);

            // Circle background
            ctx.fillStyle = 'rgba(14, 165, 233, 0.1)';
            ctx.beginPath();
            ctx.arc(0, 0, 120, 0, Math.PI * 2);
            ctx.fill();

            // Progress circle
            ctx.strokeStyle = colors.accent1;
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.arc(0, 0, 120, -Math.PI / 2, -Math.PI / 2 + (progress * Math.PI * 2));
            ctx.stroke();

            // Percentage text
            ctx.font = 'bold 72px Arial';
            ctx.fillStyle = colors.accent1;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(percentage + '%', 0, 0);

            // Label
            ctx.font = '24px Arial';
            ctx.fillStyle = colors.textSub;
            ctx.fillText('Growth', 0, 80);

            ctx.restore();
        }

        // Draw title with text animation
        function drawTitle() {
            const progress = Math.min(animationTime / 2000, 1);
            const titleOpacity = easeInOutCubic(progress);

            ctx.save();
            ctx.globalAlpha = titleOpacity;

            // Main title
            ctx.font = 'bold 120px Arial';
            ctx.fillStyle = colors.text;
            ctx.textAlign = 'center';
            ctx.fillText('Financial Growth', WIDTH / 2, HEIGHT - 240);

            // Subtitle
            ctx.font = '48px Arial';
            ctx.fillStyle = colors.textSub;
            ctx.fillText('Real-time Analytics & Investment Portfolio', WIDTH / 2, HEIGHT - 80);

            ctx.restore();
        }

        // Draw corner info
        function drawCornerInfo() {
            const seconds = Math.floor(animationTime / 1000);
            const milliseconds = animationTime % 1000;

            ctx.save();
            ctx.font = 'bold 32px Arial';
            ctx.fillStyle = colors.accent1;
            ctx.textAlign = 'right';
            ctx.fillText(`${seconds}.${Math.floor(milliseconds / 100)}s`, WIDTH - 80, 80);

            // Frame counter
            ctx.font = '24px Arial';
            ctx.fillStyle = colors.textSub;
            ctx.fillText(`Frame: ${frameCount}`, WIDTH - 80, 140);

            // 4K indicator
            ctx.font = 'bold 28px Arial';
            ctx.fillStyle = '#ec4899';
            ctx.textAlign = 'left';
            ctx.fillText('4K UHD • 60FPS', 80, 80);

            ctx.restore();
        }

        // Main render frame
        function render() {
            drawBackground();
            drawChart();
            drawLineChart();
            drawCoins();
            drawKPICards();
            drawPercentageCounter();
            drawTitle();
            drawCornerInfo();
        }

        // Animation loop
        let lastTime = Date.now();
        function animate() {
            const now = Date.now();
            const deltaTime = now - lastTime;

            if (deltaTime >= FRAME_TIME) {
                animationTime += FRAME_TIME;
                frameCount++;
                lastTime = now;

                // Loop animation
                if (animationTime > DURATION) {
                    animationTime = 0;
                    frameCount = 0;
                }

                render();
            }

            requestAnimationFrame(animate);
        }

        // Hide loading and start
        window.addEventListener('load', () => {
            loading.classList.add('hidden');
            animate();
        });

        // Fallback if load doesn't fire
        setTimeout(() => {
            loading.classList.add('hidden');
            animate();
        }, 1000);

        // Handle visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                isRunning = false;
            } else {
                isRunning = true;
                lastTime = Date.now();
            }
        });
    </script>
</body>
</html>
